name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    name: typecheck + test + build
    runs-on: ubuntu-latest
    # Env factices — le code Supabase tolère l'absence en dev/CI (APP_ENV
    # non renseigné → NODE_ENV=production côté next build, mais aucune
    # route n'est appelée pendant le build). Les VRAIES clés vivent en
    # Vercel / preprod, JAMAIS ici.
    env:
      APP_ENV: local
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
